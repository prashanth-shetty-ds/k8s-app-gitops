apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: monitoring
spec:
  parentRefs:
  - name: platform-gateway
    namespace: gateway-system
  hostnames:
  - grafana.lab.local
  rules:
  - backendRefs:
    - name: grafana
      port: 3000
