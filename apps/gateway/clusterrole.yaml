apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: envoy-gateway
rules:

# Core k8s
- apiGroups: [""]
  resources:
    - services
    - endpoints
    - pods
    - nodes
    - namespaces
    - configmaps
    - secrets
    - events
  verbs: ["get","list","watch","create","patch"]

# Discovery API
- apiGroups: ["discovery.k8s.io"]
  resources:
    - endpointslices
  verbs: ["get","list","watch"]

# Apps
- apiGroups: ["apps"]
  resources:
    - deployments
    - daemonsets
    - replicasets
  verbs: ["get","list","watch"]

# Gateway API
- apiGroups: ["gateway.networking.k8s.io"]
  resources:
    - gateways
    - gatewayclasses
    - httproutes
    - tcproutes
    - tlsroutes
    - udproutes
    - grpcroutes
    - referencegrants
    - backendtlspolicies
    - gateways/status
  verbs: ["get","list","watch","update","patch"]

# Envoy Gateway CRDs
- apiGroups: ["gateway.envoyproxy.io"]
  resources:
    - envoyproxies
    - clienttrafficpolicies
    - backendtrafficpolicies
    - securitypolicies
    - envoypatchpolicies
  verbs: ["get","list","watch"]

# Leader election
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get","list","watch","create","update"]

# Allow Envoy Gateway to manage dataplane deployments/services
- apiGroups: ["apps"]
  resources:
    - deployments
    - replicasets
  verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete

- apiGroups: [""]
  resources:
    - services
    - configmaps
    - secrets
  verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete

- apiGroups: ["autoscaling"]
  resources:
    - horizontalpodautoscalers
  verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete