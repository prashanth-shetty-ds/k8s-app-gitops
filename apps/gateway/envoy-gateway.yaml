apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-gateway
  namespace: gateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-gateway
  template:
    metadata:
      labels:
        app: envoy-gateway
    spec:
      containers:
      - name: envoy-gateway
        image: envoyproxy/gateway:v1.0.0
        args:
          - server
